name: iPod Photo bare-metal Phase 0

on:
  workflow_dispatch:
  push:
    paths:
      - "hosts/ipod-photo-baremetal/**"
      - ".github/workflows/ipod-photo-baremetal.yml"
  pull_request:
    paths:
      - "hosts/ipod-photo-baremetal/**"
      - ".github/workflows/ipod-photo-baremetal.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned LLVM 17.0.6
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "17.0.6"

      - name: Record toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-objcopy --version
          llvm-objdump --version
          readelf --version | head -1
          nm --version | head -1
          python3 --version

      - name: Build exact type-0 handoff candidate
        run: make -C hosts/ipod-photo-baremetal ci

      - name: Build GPIO-detected fallback
        run: |
          make -C hosts/ipod-photo-baremetal \
            BUILD="$GITHUB_WORKSPACE/hosts/ipod-photo-baremetal/build-auto" \
            LCD_TYPE=-1 clean all test

      - name: Build direct-image compile gate
        run: |
          make -C hosts/ipod-photo-baremetal \
            BUILD="$GITHUB_WORKSPACE/hosts/ipod-photo-baremetal/build-direct" \
            LCD_TYPE=0 HANDOFF_SIGNATURE=0 clean all test

      - name: Build other panel compile gates
        run: |
          for panel in 1 3; do
            make -C hosts/ipod-photo-baremetal \
              BUILD="$GITHUB_WORKSPACE/hosts/ipod-photo-baremetal/build-lcd-$panel" \
              LCD_TYPE="$panel" clean all
          done

      - name: Generate build report
        run: |
          cd hosts/ipod-photo-baremetal
          python3 tools/build_report.py \
            --output build/BUILD_REPORT.json \
            --variant type0-handoff,0,1,build \
            --variant auto-handoff,-1,1,build-auto \
            --variant type0-direct,0,0,build-direct \
            --matrix 1,build-lcd-1 \
            --matrix 3,build-lcd-3
          sha256sum build/BUILD_REPORT.json >> build/SHA256SUMS.txt
          cat build/SHA256SUMS.txt
          cat build/BUILD_REPORT.json

      - name: Upload reversible test kit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketjs-a1099-phase0-type0-handoff
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            hosts/ipod-photo-baremetal/Makefile
            hosts/ipod-photo-baremetal/.gitignore
            hosts/ipod-photo-baremetal/README.md
            hosts/ipod-photo-baremetal/UNTESTED-HARDWARE.txt
            hosts/ipod-photo-baremetal/boot
            hosts/ipod-photo-baremetal/include
            hosts/ipod-photo-baremetal/src
            hosts/ipod-photo-baremetal/tools
            hosts/ipod-photo-baremetal/tests
            hosts/ipod-photo-baremetal/docs
            hosts/ipod-photo-baremetal/build/pocketjs-a1099-probe.elf
            hosts/ipod-photo-baremetal/build/pocketjs-a1099-probe.bin
            hosts/ipod-photo-baremetal/build/pocketjs-a1099-probe.ipod
            hosts/ipod-photo-baremetal/build/pocketjs-a1099-probe.map
            hosts/ipod-photo-baremetal/build/pocketjs-a1099-probe.dis
            hosts/ipod-photo-baremetal/build/SHA256SUMS.txt
            hosts/ipod-photo-baremetal/build/BUILD_REPORT.json
