name: iPod Photo portable audio.pcm direct build

on:
  push:
    branches:
      - feature/ipod-photo-audio-pcm
    paths:
      - hosts/ipod-photo-baremetal/**
      - apps/ipod-photo-audio-pcm-test/**
      - framework/src/audio-api.ts
      - contracts/spec/audio.ts
      - contracts/spec/platforms.ts
      - tests/audio.test.ts
      - tests/audio-sim.test.ts
      - tests/platform-contracts.test.ts
      - tools/pocket.ts
      - tools/pocket-pack.ts
      - .github/workflows/ipod-photo-audio-pcm-publish.yml
  pull_request:
    paths:
      - hosts/ipod-photo-baremetal/**
      - apps/ipod-photo-audio-pcm-test/**
      - framework/src/audio-api.ts
      - contracts/spec/audio.ts
      - contracts/spec/platforms.ts
      - tests/audio.test.ts
      - tests/audio-sim.test.ts
      - tests/platform-contracts.test.ts
      - tools/pocket.ts
      - tools/pocket-pack.ts

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.1-jammy@sha256:6e33c70a59180c9b518f67728538312975cb3891177d20215cd2e31bdfe70791
    env:
      QUICKJS_REVISION: ba5bdd0dc013518768e76cd9e05cd30ed53dd35b
      RUST_TOOLCHAIN: nightly-2026-07-02
      CARGO_TERM_COLOR: always
      BUN_VERSION: 1.4.0
      CAMPAIGN4_COMMIT: 4fe0d13c66bf760b95ef38717ab5675fe1eee392

    steps:
      - name: Check out portable-audio branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify portable-audio source contract
        shell: bash
        run: |
          set -euo pipefail
          test -e hosts/ipod-photo-baremetal/src/audio_pcm.c
          test -e hosts/ipod-photo-baremetal/src/audio_pcm_mixer.c
          test -e hosts/ipod-photo-baremetal/tests/test_audio_pcm.c
          test -e hosts/ipod-photo-baremetal/tests/test_audio_pcm_mixer.c
          test -e hosts/ipod-photo-baremetal/docs/PHASE1_AUDIO_PCM.md
          test -e apps/ipod-photo-audio-pcm-test/app.ts
          test -e apps/ipod-photo-audio-pcm-test/pocket.json
          grep -F 'AUDIO_PCM_GATE ?= 0' hosts/ipod-photo-baremetal/Makefile.phase1
          grep -F 'portable-audio = ["cooperative-audio"]' hosts/ipod-photo-baremetal/rust-core/Cargo.toml
          grep -F 'const routedEvents = new Map<number, RoutedAudioEvent[]>();' framework/src/audio-api.ts
          grep -F '"audio.pcm"' contracts/spec/platforms.ts
          grep -F 'createWavPlayer' apps/ipod-photo-audio-pcm-test/app.ts

      - name: Install pinned build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates curl gcc git make patch unzip \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev
          rm -rf /var/lib/apt/lists/*

          curl -fsSL \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" \
            -o /tmp/bun.zip
          rm -rf /tmp/bun-extract
          mkdir -p /tmp/bun-extract
          unzip -q /tmp/bun.zip -d /tmp/bun-extract
          install -m 0755 /tmp/bun-extract/bun-linux-x64/bun /usr/local/bin/bun
          bun --revision | tee BUN.txt
          bun --revision | grep -F '1.4.0+34cbb9a40'

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Install PocketJS dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Run framework audio and platform regressions
        shell: bash
        run: |
          set -euo pipefail
          bun test tests/audio.test.ts tests/audio-sim.test.ts 2>&1 | tee framework-audio-tests.log
          bun test tests/platform-contracts.test.ts 2>&1 | tee platform-contracts-tests.log

      - name: Build and verify canonical disk guest
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/APP.PKT
          bun tools/pocket-pack.ts build \
            --manifest apps/ipod-photo-audio-pcm-test/pocket.json \
            --target ipod-photo \
            -o /tmp/APP.PKT 2>&1 | tee app-package-build.log
          bun tools/pocket-pack.ts verify /tmp/APP.PKT | tee app-package-verify.log
          bun tools/pocket-pack.ts inspect /tmp/APP.PKT | tee app-package-inspect.log
          test "$(stat -c '%s' /tmp/APP.PKT)" -le 8388608
          sha256sum /tmp/APP.PKT | tee APP_POCKET_SHA256.txt

      - name: Fetch pinned QuickJS and assemble ARMv4T sysroot
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/pocket-stack/quickjs-rs.git /tmp/quickjs-rs
          git -C /tmp/quickjs-rs checkout "$QUICKJS_REVISION"
          test "$(git -C /tmp/quickjs-rs rev-parse HEAD)" = "$QUICKJS_REVISION"
          test "$(cat /tmp/quickjs-rs/libquickjs-sys/embed/quickjs/VERSION)" = '2026-06-04'
          SYSROOT=/tmp/armv4t-sysroot
          mkdir -p "$SYSROOT/include" "$SYSROOT/libgcc" "$SYSROOT/newlib"
          cp -a /usr/include/newlib/. "$SYSROOT/include/"
          cp "$(arm-none-eabi-gcc -mcpu=arm7tdmi -marm -mfloat-abi=soft -print-libgcc-file-name)" \
            "$SYSROOT/libgcc/libgcc.a"
          cp "$(arm-none-eabi-gcc -mcpu=arm7tdmi -marm -mfloat-abi=soft --specs=nano.specs -print-file-name=libc_nano.a)" \
            "$SYSROOT/newlib/libc_nano.a"
          cp "$(arm-none-eabi-gcc -mcpu=arm7tdmi -marm -mfloat-abi=soft -print-file-name=libm.a)" \
            "$SYSROOT/newlib/libm.a"
          {
            git -C /tmp/quickjs-rs rev-parse HEAD
            arm-none-eabi-gcc --version | head -1
            printf 'libgcc=%s\n' "$(sha256sum "$SYSROOT/libgcc/libgcc.a" | cut -d' ' -f1)"
            printf 'libcNano=%s\n' "$(sha256sum "$SYSROOT/newlib/libc_nano.a" | cut -d' ' -f1)"
            printf 'libm=%s\n' "$(sha256sum "$SYSROOT/newlib/libm.a" | cut -d' ' -f1)"
          } > THIRD_PARTY.txt

      - name: Verify pinned compilers
        shell: bash
        run: |
          set -euo pipefail
          clang --version | tee TOOLCHAIN.txt
          ld.lld --version | tee -a TOOLCHAIN.txt
          llvm-objcopy --version | head -3 | tee -a TOOLCHAIN.txt
          arm-none-eabi-gcc --version | head -1 | tee -a TOOLCHAIN.txt
          rustc --version --verbose | tee -a TOOLCHAIN.txt
          cargo --version | tee -a TOOLCHAIN.txt
          clang --version | grep -F '10999b6d034fe318f3d56c83bddb6572593a8bb0'
          ld.lld --version | grep -F '17.0.0'
          rustc --print target-list | grep -Fx armv4t-none-eabi

      - name: Build portable audio.pcm firmware
        shell: bash
        run: |
          set -euo pipefail
          H=hosts/ipod-photo-baremetal
          Q=/tmp/quickjs-rs/libquickjs-sys/embed/quickjs
          S=/tmp/armv4t-sysroot
          make -C "$H" CC=clang clean all test 2>&1 | tee phase0-regression.log
          make -C "$H" -f Makefile.phase1 \
            QUICKJS_SRC="$Q" NEWLIB_SYSROOT="$S" \
            LINEAGE_GATE=1 RELIABILITY_GATE=1 \
            NATIVE_KERNEL_GATE=1 POWER_LIFECYCLE_GATE=1 \
            AUDIO_GATE=1 AUDIO_STREAM_GATE=1 AUDIO_MIX_GATE=0 AUDIO_PCM_GATE=1 \
            IMAGE_NAME=pocketjs-a1099-audio-pcm-app \
            clean all test 2>&1 | tee audio-pcm-firmware-build.log
          E="$H/build-phase1/pocketjs-a1099-audio-pcm-app.elf"
          nm "$E" | grep -F 'PJS_CORE_BACKEND_RUST'
          nm "$E" | grep -F ' JS_Eval'
          nm "$E" | grep -F ' qjs_runtime_boot'
          nm "$E" | grep -F ' pjs_audio_pcm_create_stream'
          nm "$E" | grep -F ' pjs_audio_pcm_begin_tick'
          nm "$E" | grep -F ' pjs_audio_pcm_mixer_refill'
          nm "$E" | grep -F ' pjs_audio_clock_acquire'
          nm "$E" | grep -F ' pjs_audio_dma_stop'

      - name: Rebuild Campaign-4 native mixer comparison
        shell: bash
        run: |
          set -euo pipefail
          H=hosts/ipod-photo-baremetal
          Q=/tmp/quickjs-rs/libquickjs-sys/embed/quickjs
          S=/tmp/armv4t-sysroot
          COMPARE_BUILD="$GITHUB_WORKSPACE/$H/build-phase1-mix-comparison"
          make -C "$H" -f Makefile.phase1 \
            BUILD="$COMPARE_BUILD" \
            QUICKJS_SRC="$Q" NEWLIB_SYSROOT="$S" \
            LINEAGE_GATE=1 RELIABILITY_GATE=1 \
            NATIVE_KERNEL_GATE=1 POWER_LIFECYCLE_GATE=1 \
            AUDIO_GATE=1 AUDIO_STREAM_GATE=1 AUDIO_MIX_GATE=1 AUDIO_PCM_GATE=0 \
            IMAGE_NAME=pocketjs-a1099-audio-mix-comparison \
            clean all test 2>&1 | tee audio-mix-comparison.log
          nm "$COMPARE_BUILD/pocketjs-a1099-audio-mix-comparison.elf" \
            | grep -F ' pjs_audio_mixer_refill'
          nm "$COMPARE_BUILD/pocketjs-a1099-audio-mix-comparison.elf" \
            | grep -F ' pjs_audio_clock_acquire'

      - name: Verify hardware-scope boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"audio.pcm"' contracts/spec/platforms.ts
          grep -F '"audio.pcm"' hosts/ipod-photo-baremetal/rust-core/src/lib.rs
          grep -F 'pjs_audio_pcm_reset();' hosts/ipod-photo-baremetal/src/qjs_runtime.c
          if grep -Eq 'ATA_CMD_(WRITE|WRITE_MULTIPLE|WRITE_DMA)|power_request_standby|power_charger_set_mode' \
              hosts/ipod-photo-baremetal/src/audio_pcm.c \
              hosts/ipod-photo-baremetal/src/audio_pcm_mixer.c; then
            echo 'portable audio source crossed an unrelated hardware boundary' >&2
            exit 1
          fi
          if grep -Eq 'REG32\(|IIS_CONFIG|IIS_FIFO|CLOCK_SOURCE|PLL_CONTROL' \
              hosts/ipod-photo-baremetal/src/audio_pcm.c \
              hosts/ipod-photo-baremetal/src/audio_pcm_mixer.c; then
            echo 'portable facade introduced direct audio MMIO instead of using the qualified transport' >&2
            exit 1
          fi

      - name: Assemble reversible hardware-test kit
        shell: bash
        run: |
          set -euo pipefail
          H=hosts/ipod-photo-baremetal
          B="$H/build-phase1"
          K=pocketjs-a1099-audio-pcm-test
          rm -rf "$K"
          mkdir -p "$K/provenance"

          cp "$B/pocketjs-a1099-audio-pcm-app.ipod" "$K/pocketjs-a1099-audio-pcm.ipod"
          cp /tmp/APP.PKT "$K/APP.PKT"
          cp "$H/tools/handoff.py" "$H/tools/pack_ipod.py" "$K/"

          python3 "$H/tools/build_phase1_report.py" \
            --elf "$B/pocketjs-a1099-audio-pcm-app.elf" \
            --bin "$B/pocketjs-a1099-audio-pcm-app.bin" \
            --ipod "$B/pocketjs-a1099-audio-pcm-app.ipod" \
            --output "$K/provenance/BUILD_REPORT.json" \
            --commit "$GITHUB_SHA"

          cat > "$K/provenance/PROVENANCE.txt" <<EOF
          sourceCommit: $GITHUB_SHA
          campaign4QualifiedCommit: $CAMPAIGN4_COMMIT
          quickjsRevision: $QUICKJS_REVISION
          guestBuild: canonical tools/pocket-pack.ts --target ipod-photo
          guestApi: @pocketjs/framework/audio createWavPlayer()
          guestPath: /POCKETJS/APP.PKT
          audioTransport: Campaign-4 hardware-qualified WM8975 + PP5020 I2S/DMA/clock path
          portableStreams: 4
          sourceRingFramesPerStream: 16384
          preparedOutputHighwaterFrames: 4096
          ataWritesAdded: none
          newRawAudioMmioInPortableLayer: none
          hardwareQualified: false
          EOF
          sed -i 's/^          //' "$K/provenance/PROVENANCE.txt"

          cat > "$K/INSTRUCTIONS.txt" <<'EOF'
          iPod Photo A1099 portable audio.pcm hardware test

          1. Copy APP.PKT to F:\POCKETJS\APP.PKT.
          2. Verify the APP.PKT and firmware SHA-256 values in SHA256SUMS.txt.
          3. Install the firmware through handoff.py as rockbox.ipod.
          4. Boot and listen for the four-stream audio scenario for at least 30 seconds.

          Visual guest area (lower half of screen):
          - four progress bars = streams A/B/C/D
          - long cyan bar = master volume
          - left phase chip: orange deliberate D starvation; yellow B pause; red C stop;
            purple D low-volume; green D generation replacement; cyan otherwise
          - middle small chip turns red after D's intentional underrun is delivered
          - right small chip stays green when the guest initialized

          Controls:
          - Select toggles stream B pause/play
          - Menu stops and immediately replays stream C
          - Play restarts the whole scenario
          - wheel left/right lowers/raises master volume

          Expected automatic behavior:
          - A ends first while B/C/D continue
          - D deliberately starves early, then recovers when pumping resumes
          - B pauses/resumes independently
          - C stops/replays independently
          - D changes volume, then is destroyed/recreated while siblings continue
          - scenario repeats automatically
          EOF
          sed -i 's/^          //' "$K/INSTRUCTIONS.txt"

          cat > "$K/RESULTS.txt" <<'EOF'
          first screen appeared after: ___ seconds
          audio started: yes / no
          four-stream chord/tone mix audible: yes / no / unsure
          A ended early while other audio continued: yes / no / unsure
          deliberate D dropout recovered: yes / no / unsure
          D underrun chip turned red after recovery: yes / no
          B automatic pause/resume independent: yes / no / unsure
          C automatic stop/replay independent: yes / no / unsure
          D volume change audible: yes / no / unsure
          D handle replacement did not stop siblings: yes / no / unsure
          Select B toggle: prompt / delayed / no
          Menu C replay: prompt / delayed / no
          Play scenario restart: prompt / delayed / no
          wheel volume: prompt / delayed / no
          four progress bars reacted: yes / no
          native heartbeat/input/Hold: normal / describe
          far-right native performance chip: green / yellow / orange / red
          runtime error indication: none / describe
          partial-update artifacts: none / describe
          Menu+Play reset: yes / no
          anything unexpected:
          EOF
          sed -i 's/^          //' "$K/RESULTS.txt"

          cp TOOLCHAIN.txt THIRD_PARTY.txt BUN.txt \
             APP_POCKET_SHA256.txt app-package-build.log app-package-verify.log \
             app-package-inspect.log framework-audio-tests.log \
             platform-contracts-tests.log phase0-regression.log \
             audio-pcm-firmware-build.log audio-mix-comparison.log \
             "$K/provenance/"

          (
            cd "$K"
            sha256sum pocketjs-a1099-audio-pcm.ipod APP.PKT handoff.py pack_ipod.py \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          find "$K" -maxdepth 2 -type f -print | sort

      - name: Upload portable audio hardware kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocketjs-a1099-audio-pcm-${{ github.sha }}
          path: pocketjs-a1099-audio-pcm-test
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
